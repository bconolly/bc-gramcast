name = "gramcast"
main = "crates/worker/build/index.js"
compatibility_date = "2026-11-01"

[build]
command = "cargo install --locked worker-build@0.9.0 && worker-build --release crates/worker"

[assets]
directory = "web/dist"
binding = "ASSETS"
# API calls reach the Worker; everything else is a static file (single-page app).
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "gramcast"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "VIDEOS"
# bucket_name here and the R2_BUCKET var below must name the SAME bucket.
bucket_name = "gramcast-videos"

# Placeholders only. Secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, OWNER_EMAIL) are
# set with `wrangler secret put`. Never add LOCAL_DEV_NO_AUTH here: it goes in .dev.vars.
# OWNER_EMAIL is the one email allowed to use the API. It is a SECRET, never a var and
# never in this file (the repo is public): `wrangler secret put OWNER_EMAIL`.
[vars]
# Owner sign-in (Cloudflare Access). Empty means not configured, so the API answers 503.
# TEAM_DOMAIN is your Zero Trust team domain, like "<team-name>.cloudflareaccess.com".
TEAM_DOMAIN = ""
# POLICY_AUD is the Access application's Audience (AUD) tag. See the README.
POLICY_AUD = ""
# Must match the VIDEOS binding's bucket_name above.
R2_BUCKET = "gramcast-videos"
R2_ACCOUNT_ID = "REPLACE_WITH_ACCOUNT_ID"
# Public address of this app. The YouTube redirect URI is this plus
# /api/connect/youtube/callback, and it must match the one registered with Google.
# Secrets for the connect flow (not here): YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, TOKEN_ENC_KEY.
PUBLIC_BASE_URL = "https://gramcast.gramcast.workers.dev"
# Publishing (slice 5b-2). Off until this is exactly "true". Set it to "true" only after the
# first real publish test steps in the README.
PUBLISH_ENABLED = "false"
# Who can see a published video: private, unlisted or public. Unset or anything else is
# private, so a first real test never goes public.
PUBLISH_PRIVACY = "private"

# The scheduled run that publishes due posts (the only place anything is published).
[triggers]
crons = ["*/5 * * * *"]
